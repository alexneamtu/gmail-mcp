name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: for script in deploy/*.sh test/deploy-smoke.sh; do bash -n "$script"; done
      - name: Isolated installation, update and rollback
        run: |
          git archive HEAD | docker run --rm -i -e GMAIL_MCP_DISPOSABLE_TEST=1 node:24-bookworm bash -c 'mkdir /source && tar -xf - -C /source && cd /source && bash test/deploy-smoke.sh'
